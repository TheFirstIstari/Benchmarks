[package]
name = "bench-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
clap = { version = "4.5", features = ["derive"] }
hostname = "0.4"
regex = "1.10"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
once_cell = "1.21"

[dependencies.ratatui]
version = "0.30"
features = ["crossterm"]

[dependencies.crossterm]
version = "0.29"
features = ["event-stream"]

[lib]
name = "bench_tools"
path = "lib.rs"

[[bin]]
name = "dashboard"
path = "dashboard.rs"

[[bin]]
name = "runner"
path = "runner.rs"

[[bin]]
name = "store"
path = "store.rs"

[[bin]]
name = "bench"
path = "bench.rs"
