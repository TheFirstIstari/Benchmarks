run = "dotnet run --project CS -- fileio"

[tasks.cs-math]
run = "dotnet run --project CS -- math"

[tasks.cs-network]
run = "dotnet run --project CS -- network"

[tasks.cs-crypto]
run = "dotnet run --project CS -- crypto"

[tasks.cs-ml]
run = "dotnet run --project CS -- ml"

[tasks.cs-concurrency]
run = "dotnet run --project CS -- concurrency"

[tasks.cs-cpu]
run = "dotnet run --project CS -- cpu"

[tasks.cs-allocator]
run = "dotnet run --project CS -- allocator"

# ============================================================================
# Node.js Benchmarks
# ============================================================================

[tasks.node-compile]
run = "npm install"

[tasks.node-run]
run = "node Node/benchmark.js"

# ============================================================================
# PHP Benchmarks
# ============================================================================

[tasks.php-compile]
run = "composer install"

[tasks.php-run]
run = "php PHP/benchmark.php"

# ============================================================================
# Swift Benchmarks
# ============================================================================

[tasks.swift-compile]
run = "swiftc -O -o Swift/benchmark.swift swiftc.swift"

[tasks.swift-run]
run = "./Swift/benchmark.swift"

# ============================================================================
# Zig Benchmarks
# ============================================================================

[tasks.zig-compile]
run = "zig build -Dbenchmarks"

[tasks.zig-run]
run = "./Zig/zig-out/bin/benchmark"

# ============================================================================
# Kotlin Benchmarks
# ============================================================================

[tasks.kotlin-compile]
run = "mkdir -p Kotlin/bin && javac -d Kotlin/bin Kotlin/Benchmark.kt Kotlin/*.java"

[tasks.kotlin-run]
run = "java -cp Kotlin/bin Benchmark"
