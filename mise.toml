[tools]
python = "3.13.2"
rust = "stable"
dotnet = "9.0.203"
java = "openjdk-21"
go = "latest"

[settings]
python.uv_venv_auto = "create|source"

[task_config]
dir = "/Users/frobinson/dev/Benchmarks"

[tasks.install]
run = "mise install"

[tasks.default]
run = "mise tasks"

[tasks.compile]
depends = ["compile-all"]

# ============================================================================
# Compile All (run these before benchmarking)
# ============================================================================

[tasks.compile-all]
depends = ["c-compile", "cpp-compile", "java-compile", "rust-compile", "go-compile", "cs-compile"]

# ============================================================================
# Run All Benchmarks
# ============================================================================

[tasks.all]
depends = ["compile-all", "run-all-benchmarks"]

[tasks.run-all-benchmarks]
depends = ["c-run", "cpp-run", "python-all", "java-run", "rust-run", "go-run", "ruby-run", "cs-run"]

